<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="xedik-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <linearGradient id="xedik-grad-secondary" x1="44" y1="4" x2="4" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60A5FA"/>
            <stop offset="60%" stop-color="#1E40AF"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <filter id="xedik-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- Background rounded square with subtle glass border -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Stylized Geometric "X" monogram -->
    <path d="M12 12L36 36M12 12L19 12L36 29M12 12V19L29 36H36" stroke="url(#xedik-grad-primary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 12L12 36" stroke="url(#xedik-grad-secondary)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Central tech dot -->
    <circle cx="24" cy="24" r="3.5" fill="#38BDF8" filter="url(#xedik-glow)"/>
</svg>
